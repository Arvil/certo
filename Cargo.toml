[package]
categories = ["command-line-utilities"]
description = "A Small SSL Certificate Watchdog"
edition = "2021"
homepage = "https://github.com/Arvil/certo"
keywords = ["certificate", "watchdog"]
license = "MIT"
name = "certo"
readme = "README.md"
repository = "https://github.com/Arvil/certo"
rust-version = "1.88"
version = "0.1.6"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
env_logger = "0.11.11"
log = "0.4.34"
rayon = "1.12.0"
rustls = { version = "0.23.43" }
rustls-native-certs = "0.8.4"
rustls-pki-types = "1.15.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
time = "0.3.55"
webpki-roots = "1.0.9"
x509-parser = "0.18.1"

[dev-dependencies]
rcgen = "0.14.10"

[profile.release]
strip = true
lto = true
codegen-units = 1
