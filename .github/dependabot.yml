# Dependabot configuration for certo.
#
# Cargo dependencies and GitHub Actions are both updated weekly.  Minor and
# patch updates of the same ecosystem are grouped into a single PR so the
# queue stays reviewable; major bumps (rare for the 0.x crates we track) and
# security updates always get their own PR.

version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      actions:
        update-types:
          - "minor"
          - "patch"
