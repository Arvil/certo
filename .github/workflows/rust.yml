name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

# Least privilege for the automatic GITHUB_TOKEN: every job below only gets
# read access unless it explicitly overrides this.  The `release` job is the
# sole exception (it creates a GitHub Release).
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # All build/test jobs run inside the repository's devcontainer
      # (.devcontainer/), so CI uses exactly the toolchain developers use.
      # persist-credentials: false keeps the token out of the checkout's git
      # config; these jobs never push.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          push: never
          runCmd: |
            cargo fmt --check
            cargo clippy --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # NB: on pull_request events this compiles and runs contributor code
      # (build scripts, tests).  With the read-only token above and no
      # persisted credentials, such code cannot touch the repository.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          push: never
          runCmd: |
            cargo test --all-targets

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Guards the `rust-version` declared in Cargo.toml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          push: never
          runCmd: |
            rustup toolchain install 1.88 --profile minimal
            cargo +1.88 build --locked

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Run cargo-audit directly rather than via rustsec/audit-check: that
      # action publishes a check run through the Checks API, which fails with
      # "Resource not accessible by integration" when the token is read-only
      # (always the case for Dependabot and fork PRs).  The step still fails
      # the job when a vulnerability is found, and prints the advisories.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          push: never
          runCmd: |
            .devcontainer/install-tools.sh cargo-audit
            cargo audit

  sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          push: never
          runCmd: |
            .devcontainer/install-tools.sh cargo-cyclonedx
            cargo cyclonedx -f json --spec-version 1.5
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-cyclonedx
          path: certo.cdx.json
          if-no-files-found: error

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          push: never
          runCmd: |
            cargo build --verbose --locked

  release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    needs: [lint, test, msrv, audit]
    # Creates the GitHub release when Cargo.toml's version has no release yet.
    permissions:
      contents: write
    outputs:
      created: ${{ steps.release.outputs.created }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create the release when the version changes
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Read the version from cargo itself rather than grepping Cargo.toml:
          # text matching trips over keys such as `rust-version`.
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "certo") | .version')
          TAG="v${VERSION}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release ${TAG} already exists - skipping"
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
            echo "created=true" >> "$GITHUB_OUTPUT"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          fi

  attach:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: release
    if: needs.release.outputs.created == 'true'
    # Builds the release binary and attaches it with the SBOM and checksums.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install SBOM tooling
        run: cargo install cargo-auditable cargo-cyclonedx --locked
      - name: Build release binary with embedded dependency manifest
        run: cargo auditable build --release
      - name: Generate CycloneDX SBOM
        run: cargo cyclonedx -f json --spec-version 1.5
      - name: Collect artifacts
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "certo") | .version')
          mkdir -p dist
          cp target/release/certo "dist/certo-${VERSION}-x86_64-linux"
          cp certo.cdx.json "dist/certo-${VERSION}.cdx.json"
          (cd dist && sha256sum -- * > SHA256SUMS)
      - name: Upload artifacts to the release
        run: gh release upload "$TAG" dist/* --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
